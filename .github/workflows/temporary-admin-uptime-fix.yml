name: Apply Admin Uptime Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update owner console runtime timer
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/owner-console.tsx')
          text = path.read_text(encoding='utf-8')

          old_query = '''    refetchInterval: 30_000,\n  });\n\n  const [activityOpen, setActivityOpen] = useState(false);\n  const [uptimeSeconds, setUptimeSeconds] = useState(() => {\n    if (typeof window === "undefined") return 0;\n\n    const storageKey = "ahoy-owner-console-uptime-start";\n    const existing = window.localStorage.getItem(storageKey);\n\n    if (existing) {\n      const parsed = Number(existing);\n\n      if (Number.isFinite(parsed) && parsed > 0) {\n        return Math.max(0, Math.floor((Date.now() - parsed) / 1000));\n      }\n    }\n\n    const now = Date.now();\n    window.localStorage.setItem(storageKey, String(now));\n    return 0;\n  });\n\n  useEffect(() => {\n    const timer = window.setInterval(() => {\n      setUptimeSeconds((value) => value + 1);\n    }, 1000);\n\n    return () => window.clearInterval(timer);\n  }, []);'''

          new_query = '''    refetchInterval: 15_000,\n  });\n\n  const [activityOpen, setActivityOpen] = useState(false);\n  const [clockNow, setClockNow] = useState(() => Date.now());\n\n  useEffect(() => {\n    const timer = window.setInterval(() => setClockNow(Date.now()), 1000);\n    return () => window.clearInterval(timer);\n  }, []);'''

          if old_query not in text:
              raise SystemExit('Expected localStorage uptime block was not found.')
          text = text.replace(old_query, new_query, 1)

          old_uptime = '''  const uptime = formatUptime(uptimeSeconds);'''
          new_uptime = '''  const heartbeatMs = data.botRuntime?.heartbeatAt\n    ? Date.parse(data.botRuntime.heartbeatAt)\n    : Number.NaN;\n  const startedMs = data.botRuntime?.startedAt\n    ? Date.parse(data.botRuntime.startedAt)\n    : Number.NaN;\n  const stoppedMs = data.botRuntime?.stoppedAt\n    ? Date.parse(data.botRuntime.stoppedAt)\n    : Number.NaN;\n\n  const heartbeatFresh =\n    Number.isFinite(heartbeatMs) &&\n    clockNow - heartbeatMs <= 45_000;\n  const isBotOnline =\n    data.botRuntime?.status === "online" &&\n    !Number.isFinite(stoppedMs) &&\n    Number.isFinite(startedMs) &&\n    heartbeatFresh;\n  const uptimeSeconds = isBotOnline\n    ? Math.max(0, Math.floor((clockNow - startedMs) / 1000))\n    : 0;\n  const uptime = isBotOnline ? formatUptime(uptimeSeconds) : "Offline";'''

          if old_uptime not in text:
              raise SystemExit('Expected uptime calculation was not found.')
          text = text.replace(old_uptime, new_uptime, 1)
          text = text.replace('hint: "This dashboard session",', 'hint: "Actual bot runtime",', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f UPTIME_FIX_TRIGGER.txt .github/workflows/fix-admin-uptime.yml .github/workflows/apply-runtime-fix.yml || true
          git add src/routes/owner-console.tsx .github/workflows/temporary-admin-uptime-fix.yml
          git diff --cached --check
          git commit -m "Fix Admin Console bot uptime timer"
          git push --force-with-lease origin HEAD:main
